#
# CI overlay of compose.yaml for the check compose.up of run.sh: the Twilio REST API of the adapter is the
# platform stub of the stand, and no port is published on the machine that runs the check. The values of
# .env come from the env file run.sh generates.
#
#   docker compose -f compose.yaml -f ci/compose.ci.yaml --env-file <generated> up -d

services:

  veriqa:
    ports: !reset []

  adapter:
    ports: !reset []
    depends_on: [stub]
    environment:
      TWILIO_API_URL: http://stub:9000

  stub:
    image: veriqa-sample-whatsapp-twilio-stand:latest
    command: ["node", "stub.mjs"]
    environment:
      STUB_PORT: "9000"
      STUB_ACCOUNTS: "${TWILIO_ACCOUNT_SID}:${TWILIO_AUTH_TOKEN}:${TWILIO_WHATSAPP_FROM}"
